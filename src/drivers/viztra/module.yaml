module_name: Viztra Visual Observation
serial_config:
    - command: viztra start -d ${SERIAL_DEV}
      port_config_param:
        name: VIZTRA_CFG
        group: Sensors

parameters:
    - group: Sensors
      definitions:
        SENS_EN_VIZTRA:
            description:
                short: Enable Viztra visual observation driver
                long: Enable the Viztra serial driver during sensor startup. The serial port is selected by VIZTRA_CFG.
            type: boolean
            default: 0
            reboot_required: true
        VIZTRA_TOUT:
            description:
                short: Viztra observation timeout
                long: Maximum age of a valid Viztra serial frame or observation before it is reported stale.
            type: int32
            unit: ms
            min: 50
            max: 5000
            default: 500
            reboot_required: true
