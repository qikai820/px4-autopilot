module_name: Dock Guidance

# Parameter metadata is kept here so PX4 can generate the parameter table and
# component metadata directly from the module configuration.
parameters:
  - group: Dock Guidance
    definitions:
      DOCK_GUIDANCE:
        description: {short: Enable Dock Guidance startup}
        type: boolean
        default: true
      DOCK_PRE_EN:
        description: {short: Enable moving target rear-position guidance before visual Dock}
        type: boolean
        default: true
      DOCK_PRE_DIST:
        description: {short: Distance behind target trajectory for visual acquisition}
        type: float
        unit: m
        min: 1
        max: 1000
        default: 100.0
      DOCK_PRE_ZOFF:
        description: {short: Height above rear trajectory point}
        type: float
        unit: m
        min: -100
        max: 100
        default: 0.0
      DOCK_PRE_VIS_T:
        description: {short: Continuous valid image tracking time for visual handoff}
        type: float
        unit: s
        min: 0.05
        max: 5
        default: 0.3
      DOCK_PRE_TOUT:
        description: {short: Target-position stream timeout during rear guidance}
        type: int32
        unit: ms
        min: 100
        max: 5000
        default: 300
      DOCK_PRE_PRED_T:
        description: {short: Maximum target-motion prediction horizon}
        type: float
        unit: s
        min: 0
        max: 3
        default: 1.0
      DOCK_CAM_DLY:
        description:
          short: Camera delay compensation
          long: Delay from image exposure to timestamp_sample reception. Applied once to body attitude, local position and camera command history. Does not measure servo mechanical lag.
        type: int32
        unit: ms
        min: 0
        max: 5000
        default: 0
      DOCK_OBS_TOUT:
        description: {short: Visual observation timeout}
        type: int32
        min: 20
        max: 5000
        default: 150
      DOCK_CAM_ROLL:
        description: {short: Camera-to-body roll rotation}
        type: float
        min: -180
        max: 180
        default: -90.0
      DOCK_CAM_PITCH:
        description: {short: Camera-to-body pitch rotation}
        type: float
        min: -180
        max: 180
        default: 0.0
      DOCK_CAM_SERVO:
        description:
          short: Enable variable camera pitch servo
          long: Assign an unused output to Gimbal Pitch (function 421).
        type: boolean
        default: false
      DOCK_CAM_P_MIN:
        description: {short: Camera pitch servo minimum angle}
        type: float
        min: -180
        max: 180
        decimal: 1
        default: 0.0
      DOCK_CAM_P_MAX:
        description: {short: Camera pitch servo maximum angle}
        type: float
        min: -180
        max: 180
        decimal: 1
        default: 90.0
      DOCK_CAM_P_RATE:
        description: {short: Camera pitch servo maximum slew rate}
        type: float
        min: 0.1
        max: 30
        decimal: 1
        default: 5.0
      DOCK_CAM_P_TC:
        description: {short: Camera pitch image-centering time constant}
        type: float
        min: 0.2
        max: 20
        decimal: 1
        default: 2.0
      DOCK_CAM_P_DB:
        description: {short: Camera pitch servo image deadband}
        type: float
        min: 0
        max: 10
        decimal: 1
        default: 0.5
      DOCK_CAM_YAW:
        description: {short: Camera-to-body yaw rotation}
        type: float
        min: -180
        max: 180
        default: 0.0
      DOCK_FILT_HZ:
        description: {short: LOS vector filter cutoff frequency}
        type: float
        default: 2.0
      DOCK_RES_X:
        description: {short: Camera image width}
        type: float
        default: 1920.0
      DOCK_RES_Y:
        description: {short: Camera image height}
        type: float
        default: 1080.0
      DOCK_FOV_X:
        description: {short: Camera horizontal field of view}
        type: float
        default: 60.0
      DOCK_FOV_Y:
        description: {short: Camera vertical field of view}
        type: float
        default: 45.0
      DOCK_LOS_MAX:
        description: {short: Maximum accepted camera LOS angle}
        type: float
        min: 10
        max: 89.9
        default: 89.0
      DOCK_VEL_MAX:
        description: {short: Maximum approach speed}
        type: float
        min: 0
        max: 100
        decimal: 1
        default: 15.0
      DOCK_ACC_MAX:
        description: {short: Maximum approach acceleration}
        type: float
        min: 0.1
        max: 20
        decimal: 1
        default: 3.0
      DOCK_THR:
        description:
          short: Dock fixed collective throttle
          long: >
            Zero disables fixed throttle and its slew limiter. When positive, ramp the final
            body-Z throttle sent to control allocation after battery scaling, then hold this
            normalized scalar throughout healthy Dock stages. With DOCK_BRK_EN enabled,
            post-pass and Dock-fault-to-RTL braking instead use DOCK_BRK_THR;
            DOCK_BRK_TMIN enforces a higher final-output floor above DOCK_BRK_TVEL.
            Reaching DOCK_VEL_MAX does not release it. The attitude/rate controllers continue
            producing torque, so individual motor outputs may differ. Bounded by MPC thrust
            limits. Fixed throttle changes altitude and braking response. Ground contact,
            invalid guidance, stale commands and mode exit restore normal control immediately,
            except for a verified automatic Dock fault handoff to RTL.
        type: float
        min: 0
        max: 1
        decimal: 2
        default: 0.0
      DOCK_THR_RATE:
        description:
          short: Dock collective throttle slew rate
          long: >
            Maximum normalized final body-Z throttle change per second while DOCK_THR,
            post-pass braking or Dock-fault-to-RTL braking is enabled.
            Applies to entry and changes of DOCK_THR throughout healthy Dock operation in both
            directions. A value of 0.2 changes thrust by at most 20 percentage points per second.
            Smaller values give slower transitions. The high-speed DOCK_BRK_TMIN
            floor can raise throttle immediately. Mode exit and invalid guidance
            bypass this limiter.
        type: float
        min: 0.01
        max: 2
        decimal: 2
        default: 0.2
      DOCK_BRK_EN:
        description:
          short: Thrust-preserving post-pass braking
          long: >
            After PASS_PREDICTED or automatic Dock fault handoff to RTL, tilt against
            measured horizontal velocity while preserving thrust and temporarily relaxing
            vertical velocity control. Fade to normal control at low speed. Uses
            MPC_TILTMAX_AIR and MPC thrust limits. Does not change vision recovery or
            terminal approach. Disable to omit this thrust brake during fault RTL.
        type: boolean
        default: 1
      DOCK_BRK_THR:
        description:
          short: Dock recovery braking thrust floor
          long: >
            High-speed braking uses the greater of this value and tilt-compensated
            hover thrust. The floor fades below DOCK_BRK_VEL and is released at 0.5 m/s.
            MPC_THR_MAX always wins. Altitude can change while braking; this is not altitude hold.
        type: float
        min: 0
        max: 1
        decimal: 2
        default: 0.35
      DOCK_BRK_TMIN:
        description:
          short: Minimum collective during high-speed Dock braking
          long: >
            Minimum final normalized body-Z collective while post-pass or automatic
            Dock-fault-to-RTL braking is active and measured horizontal speed is at or above
            DOCK_BRK_TVEL. Applies immediately on entry, including the pitch/roll
            transition, even if DOCK_THR_RATE would otherwise delay an increase.
            MPC_THR_MAX takes priority. Below DOCK_BRK_TVEL, normal throttle slew
            resumes from the last output. This does not guarantee any individual
            motor output or altitude hold.
        type: float
        min: 0
        max: 1
        decimal: 2
        default: 0.70
      DOCK_BRK_TVEL:
        description:
          short: Speed for minimum braking collective
          long: >
            Keep DOCK_BRK_TMIN active while measured horizontal speed is at or above
            this threshold. The floor releases strictly below it; DOCK_THR_RATE
            then limits any downward collective transition. This is separate from
            DOCK_BRK_VEL, which blends braking tilt, and DOCK_REC_YAW_V, which
            controls when yaw may turn.
        type: float
        unit: m/s
        min: 0.5
        max: 30
        decimal: 1
        default: 8.0
      DOCK_BRK_RATE:
        description:
          short: Dock recovery braking tilt slew rate
          long: >
            Maximum rotation rate of the commanded thrust direction during recovery braking
            and return to normal control. Hard MPC tilt limits take priority.
        type: float
        unit: deg/s
        min: 5
        max: 180
        decimal: 1
        default: 45
      DOCK_BRK_VEL:
        description:
          short: Speed for full Dock recovery braking
          long: >
            At or above this horizontal speed, fully prioritize braking against measured motion
            and preserve thrust. Tilt also reserves speed for leveling out. Below this speed reduce braking authority;
            at 0.5 m/s normal velocity and vertical control take over. Larger values start
            the transition earlier to reduce reverse motion near a stop.
        type: float
        unit: m/s
        min: 2
        max: 30
        decimal: 1
        default: 10
      DOCK_REC_YAW_V:
        description:
          short: Dock recovery yaw release speed
          long: >
            In PASS_PREDICTED, hold the measured heading at recovery entry while measured
            3-D speed is at or above this threshold. Below it, slew toward the heading target
            saved before recovery at DOCK_YAW_RATE. Re-lock the current measured heading if
            speed rises to the threshold again. Also holds measured heading when an
            automatic Dock fault transfers control to RTL. RTL translation remains at
            zero while speed is reduced below this threshold and the measured heading
            aligns with the settled RTL yaw target at MPC_YAWRAUTO_MAX. Translation resumes
            with a velocity-setpoint ramp; normal RTL then owns yaw. If the RTL yaw target
            is unavailable or alignment times out, native RTL regains control. When DOCK_EXIT_MODE
            selects Hold, the fault handoff instead keeps its zero-speed goal until Hold
            is requested. Applies with either post-pass braking method.
        type: float
        unit: m/s
        min: 0.1
        max: 20
        decimal: 1
        default: 2.0
      DOCK_EXIT_MODE:
        description:
          short: Mode after Dock braking
          long: >
            Select the flight mode after a predicted target pass has decelerated to below
            0.5 m/s for 0.5 seconds. On a Dock fault, Commander first takes over in RTL
            and the existing fault braking runs; Hold is requested only after the same
            stop check succeeds. If velocity or position is invalid, Commander retains
            its failsafe authority. A predicted pass does not confirm physical contact.
        type: enum
        values:
          0: RTL
          1: Hold
        default: 0
      DOCK_DEC_MAX:
        description: {short: Maximum approach deceleration}
        type: float
        min: 0.1
        max: 20
        decimal: 1
        default: 3.0
      DOCK_STOP_DIST:
        description:
          short: Final stand-off distance
          long: >
            Target stopping distance when DOCK_TERM_EN is disabled. With terminal pass-through
            enabled, neither static nor dynamic approach uses this distance to slow down before the target.
        type: float
        min: 0
        max: 100
        decimal: 1
        default: 2.0
      DOCK_ALIGN_T:
        description: {short: Required target alignment time}
        type: float
        min: 0.05
        max: 5
        decimal: 2
        default: 1.0
      DOCK_FOV_ALIGN:
        description: {short: Alignment region as fraction of camera half-FOV}
        type: float
        min: 0.05
        max: 0.8
        decimal: 2
        default: 0.30
      DOCK_FOV_SOFT:
        description: {short: Soft FOV boundary as fraction of camera half-FOV}
        type: float
        min: 0.1
        max: 0.95
        decimal: 2
        default: 0.65
      DOCK_FOV_HARD:
        description: {short: Hard FOV boundary as fraction of camera half-FOV}
        type: float
        min: 0.2
        max: 0.99
        decimal: 2
        default: 0.85
      DOCK_FOV_H_T:
        description: {short: Hard FOV confirmation time}
        type: float
        min: 0
        max: 1
        decimal: 2
        default: 0.15
      DOCK_REC_T:
        description: {short: Recovery alignment hold time}
        type: float
        min: 0.1
        max: 5
        decimal: 2
        default: 1.0
      DOCK_ALIGN_SPD:
        description: {short: Maximum alignment translation speed}
        type: float
        min: 0.1
        max: 5
        decimal: 1
        default: 1.0
      DOCK_IMG_P:
        description: {short: Image tracking proportional gain}
        type: float
        min: 0.05
        max: 5
        decimal: 2
        default: 0.3
      DOCK_IMG_VMAX:
        description: {short: Maximum image tracking translation speed}
        type: float
        min: 0.1
        max: 20
        decimal: 1
        default: 1.0
      DOCK_IMG_FRAC:
        description: {short: Maximum image-correction fraction}
        type: float
        min: 0.05
        max: 0.8
        decimal: 2
        default: 0.40
      DOCK_LEG_VMAX:
        description: {short: Maximum angle-only approach speed}
        type: float
        min: 0.1
        max: 20
        decimal: 1
        default: 5.0
      DOCK_DYN_EN:
        description:
          short: Enable metric Dock guidance
          long: With DOCK_TERM_EN and DOCK_PRED_EN enabled, uses relative position and relative rate for static and moving target interception. Otherwise retains estimated target following.
        type: boolean
        default: false
      DOCK_PRED_EN:
        description:
          short: Enable three-dimensional predicted miss correction
          long: With dynamic pass-through enabled, plans earliest feasible three-dimensional encounter from relative motion, aircraft response and command limits. Does not require absolute target velocity convergence. Blind permission separately checks the actual published velocity and uncertainty. Other modes retain predicted miss correction.
        type: boolean
        default: true
      DOCK_PRED_TAU:
        description:
          short: Predicted velocity response time constant
          long: Aircraft velocity response time constant. Relative interception explicitly simulates the command acceleration and jerk governor in addition to this response. Must be validated from logged command and actual velocity; not camera latency.
        type: float
        unit: s
        min: 0.05
        max: 2.0
        decimal: 2
        default: 0.5
      DOCK_PRED_TMAX:
        description: {short: Maximum three-dimensional encounter prediction horizon}
        type: float
        unit: s
        min: 0.2
        max: 10.0
        decimal: 1
        default: 5.0
      DOCK_PRED_ANG:
        description: {short: Maximum predictive velocity direction adjustment}
        type: float
        unit: deg
        min: 1.0
        max: 30.0
        decimal: 1
        default: 15.0
      DOCK_CAP_PRED_T:
        description: {short: Maximum capture prediction time to target plane}
        type: float
        unit: s
        min: 0.2
        max: 5.0
        decimal: 1
        default: 2.0
      DOCK_PRED_CFM:
        description: {short: Continuous capture prediction confirmation time}
        type: float
        unit: s
        min: 0.1
        max: 1.0
        decimal: 2
        default: 0.2
      DOCK_BLIND_TGO:
        description: {short: Maximum predicted time to plane when entering blind dash}
        type: float
        unit: s
        min: 0.1
        max: 0.5
        decimal: 2
        default: 0.35
      DOCK_TGT_W:
        description: {short: Calibrated target projected width}
        type: float
        unit: m
        min: 0
        max: 100
        default: 0.0
      DOCK_TGT_H:
        description: {short: Calibrated target projected height}
        type: float
        unit: m
        min: 0
        max: 100
        default: 0.0
      DOCK_SIZE_ERR:
        description: {short: Target extent relative uncertainty}
        type: float
        min: 0.02
        max: 0.5
        default: 0.15
      DOCK_EST_ACC:
        description: {short: Target acceleration process noise}
        type: float
        min: 0.1
        max: 30
        default: 3.0
      DOCK_EST_VMAX:
        description: {short: Target estimate speed rejection limit}
        type: float
        unit: m/s
        min: 1
        max: 100
        default: 60.0
      DOCK_EST_VERR:
        description: {short: Maximum target velocity estimation error}
        type: float
        unit: m/s
        min: 0.1
        max: 20
        default: 3.0
      DOCK_MATCH_ERR:
        description: {short: Following velocity error before approach}
        type: float
        unit: m/s
        min: 0.1
        max: 10
        default: 2.0
      DOCK_REL_VMAX:
        description: {short: Maximum relative approach speed}
        type: float
        unit: m/s
        min: 0
        max: 60
        default: 10.0
      DOCK_DYN_JERK:
        description: {short: Dynamic velocity command jerk limit}
        type: float
        unit: m/s^3
        min: 0.1
        max: 100
        default: 8.0
      DOCK_PASS_ERR:
        description: {short: Maximum predicted pass uncertainty and miss}
        type: float
        unit: m
        min: 0.1
        max: 20
        default: 3.0
      DOCK_PASS_DIST:
        description: {short: Predicted distance beyond target plane}
        type: float
        unit: m
        min: 0.1
        max: 10
        default: 2.0
      DOCK_LEGACY_APP:
        description: {short: Allow angle-only approach with legacy Viztra frames}
        type: boolean
        default: false
      DOCK_TERM_EN:
        description:
          short: Enable maximum-speed terminal dash
          long: >
            Enables terminal pass-through and disables the target stopping-distance speed envelope
            throughout normal static and dynamic approach, including before terminal entry.
            Normal post-pass braking starts only after PASS_PREDICTED. Observation, state and
            terminal timeout protections remain active; a timeout is not completion.
        type: boolean
        default: true
      DOCK_TERM_DIST:
        description: {short: Terminal-dash distance threshold}
        type: float
        unit: m
        min: 0
        max: 100
        decimal: 1
        default: 0.0
      DOCK_TERM_SIZE:
        description: {short: Terminal-dash target-size threshold}
        type: float
        min: 0.01
        max: 1.0
        decimal: 2
        default: 0.10
      DOCK_TERM_CFM:
        description: {short: Terminal-dash entry confirmation time}
        type: float
        min: 0.02
        max: 2.0
        decimal: 2
        default: 0.05
      DOCK_TERM_BLIND:
        description: {short: Terminal visual-loss hold time}
        type: float
        min: 0.05
        max: 3.0
        decimal: 2
        default: 0.50
      DOCK_TERM_MAX_T:
        description: {short: Maximum terminal-dash duration}
        type: float
        min: 0.1
        max: 10.0
        decimal: 1
        default: 1.5
      DOCK_TERM_FILT:
        description: {short: Terminal LOS filter cutoff}
        type: float
        min: 1.0
        max: 30.0
        decimal: 1
        default: 10.0
      DOCK_YAW_DB:
        description: {short: Camera yaw-error deadband}
        type: float
        min: 0
        max: 10
        decimal: 1
        default: 1.0
      DOCK_YAW_RATE:
        description: {short: Maximum yaw-setpoint slew rate}
        type: float
        min: 1
        max: 90
        decimal: 1
        default: 10.0
      DOCK_VIS_GRACE:
        description: {short: Visual-loss grace period}
        type: int32
        min: 20
        max: 2000
        default: 300
      DOCK_START_H:
        description:
          short: Dynamic Dock startup height gain
          long: Climb above local height at airborne Dock engagement; zero disables the climb. With dynamic predicted pass-through, relative guidance takes over once scale and relative rate are available and climbs towards the encounter without settling at the startup height.
        type: float
        unit: m
        min: 0
        max: 100
        decimal: 1
        default: 10.0
      DOCK_CAP_VMAX:
        description: {short: Initial visual capture speed with uncertain target motion}
        type: float
        unit: m/s
        min: 0
        max: 10
        decimal: 1
        default: 3.0
      DOCK_REL_TOUT:
        description: {short: Relative-position timeout}
        type: int32
        min: 20
        max: 2000
        default: 200
