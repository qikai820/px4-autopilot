# Optional shared Dock parameters referenced by the complete copied MC wrappers.
# Registered only when the Dock module itself is absent.
module_name: Vector MC compatibility
parameters:
- group: Dock Guidance
  definitions:
    DOCK_THR_RATE:
      description:
        short: Dock collective throttle slew rate
        long: 'Maximum normalized final body-Z throttle change per second while DOCK_THR,
          post-pass braking or Dock-fault-to-RTL braking is enabled. Applies to entry
          and changes of DOCK_THR throughout healthy Dock operation in both directions.
          A value of 0.2 changes thrust by at most 20 percentage points per second.
          Smaller values give slower transitions. The high-speed DOCK_BRK_TMIN floor
          can raise throttle immediately. Mode exit and invalid guidance bypass this
          limiter.

          '
      type: float
      min: 0.01
      max: 2
      decimal: 2
      default: 0.2
    DOCK_BRK_EN:
      description:
        short: Thrust-preserving post-pass braking
        long: 'After PASS_PREDICTED or automatic Dock fault handoff to RTL, tilt against
          measured horizontal velocity while preserving thrust and temporarily relaxing
          vertical velocity control. Fade to normal control at low speed. Uses MPC_TILTMAX_AIR
          and MPC thrust limits. Does not change vision recovery or terminal approach.
          Disable to omit this thrust brake during fault RTL.

          '
      type: boolean
      default: 1
    DOCK_BRK_MODE:
      description:
        short: Dock high-speed braking method
        long: 'Method 0 retains the existing thrust-direction brake. Method 1 uses
          a bounded climb to exchange kinetic energy for height, then levels and arrests
          vertical speed. Both methods serve predicted-pass and verified automatic
          Dock guidance-fault braking when aircraft state and attitude estimates remain
          valid. Method 1 requests Hold after a normal predicted pass; fault exits
          still follow DOCK_EXIT_MODE.

          '
      type: enum
      values:
        0: Thrust-direction braking
        1: Climb braking
      default: 0
    DOCK_CLB_P_RATE:
      description:
        short: Maximum climb-brake tilt rotation rate
      type: float
      unit: deg/s
      min: 5
      max: 90
      decimal: 1
      default: 30
    DOCK_CLB_TILT:
      description:
        short: Maximum climb-brake tilt angle
        long: Bounded further by MPC_TILTMAX_AIR and available thrust.
      type: float
      unit: deg
      min: 5
      max: 80
      decimal: 1
      default: 45
    DOCK_CLB_DH_MAX:
      description:
        short: Maximum extra height during climb braking
        long: 'Relative to the aircraft local altitude when the shared braking session
          first starts. It is not an absolute AMSL or home altitude. A Dock-to-RTL
          fault handoff retains the consumed height budget. The controller starts
          collecting angle before the limit; physical overshoot can still occur if
          the airframe cannot arrest its climb.

          '
      type: float
      unit: m
      min: 2
      max: 100
      decimal: 1
      default: 20
    DOCK_CLB_VMAX:
      description:
        short: Maximum commanded climb speed during braking
        long: Zero inherits MPC_Z_VEL_MAX_UP. Vehicle constraints can lower it.
      type: float
      unit: m/s
      min: 0
      max: 20
      decimal: 1
      default: 0
    DOCK_CLB_A_UP:
      description:
        short: Maximum climb command acceleration
        long: 'Zero inherits MPC_ACC_UP_MAX. This limits the velocity target ramp;
          DOCK_DYN_JERK limits changes in commanded acceleration.

          '
      type: float
      unit: m/s^2
      min: 0
      max: 15
      decimal: 1
      default: 0
    DOCK_CLB_A_DN:
      description:
        short: Climb speed arrest acceleration
        long: 'Zero inherits MPC_ACC_DOWN_MAX. Used for early level-out planning and
          the velocity target ramp; DOCK_DYN_JERK also applies. Actual vertical authority
          can be lower.

          '
      type: float
      unit: m/s^2
      min: 0
      max: 15
      decimal: 1
      default: 0
    DOCK_CLB_TMAX:
      description:
        short: Maximum active climb-braking duration
      type: float
      unit: s
      min: 1
      max: 30
      decimal: 1
      default: 10
    DOCK_BRK_THR:
      description:
        short: Dock recovery braking thrust floor
        long: 'High-speed braking uses the greater of this value and tilt-compensated
          hover thrust. The floor fades below DOCK_BRK_VEL and is released at 0.5
          m/s. MPC_THR_MAX always wins. Altitude can change while braking; this is
          not altitude hold.

          '
      type: float
      min: 0
      max: 1
      decimal: 2
      default: 0.35
    DOCK_BRK_TMIN:
      description:
        short: Minimum collective during high-speed Dock braking
        long: 'Minimum final normalized body-Z collective while post-pass or automatic
          Dock-fault-to-RTL braking is active and measured horizontal speed is at
          or above DOCK_BRK_TVEL. Applies immediately on entry, including the pitch/roll
          transition, even if DOCK_THR_RATE would otherwise delay an increase. MPC_THR_MAX
          takes priority. Below DOCK_BRK_TVEL, normal throttle slew resumes from the
          last output for method 0. During method 1 pull-up, the floor remains active
          until early angle capture; capture releases the high floor and final slew
          so vertical speed can be arrested. DOCK_BRK_THR can remain as a lower floor
          until the aircraft levels. This does not guarantee any individual motor
          output or altitude hold.

          '
      type: float
      min: 0
      max: 1
      decimal: 2
      default: 0.7
    DOCK_BRK_TVEL:
      description:
        short: Speed for minimum braking collective
        long: 'Keep DOCK_BRK_TMIN active while measured horizontal speed is at or
          above this threshold. The floor releases strictly below it; DOCK_THR_RATE
          then limits any downward collective transition. This is separate from DOCK_BRK_VEL,
          which blends braking tilt, and DOCK_REC_YAW_V, which controls when yaw may
          turn.

          '
      type: float
      unit: m/s
      min: 0.5
      max: 30
      decimal: 1
      default: 8.0
    DOCK_BRK_RATE:
      description:
        short: Dock recovery braking tilt slew rate
        long: 'Maximum rotation rate of the commanded thrust direction during recovery
          braking and return to normal control. Hard MPC tilt limits take priority.

          '
      type: float
      unit: deg/s
      min: 5
      max: 180
      decimal: 1
      default: 45
    DOCK_BRK_VEL:
      description:
        short: Speed for full Dock recovery braking
        long: 'At or above this horizontal speed, fully prioritize braking against
          measured motion and preserve thrust. Tilt also reserves speed for leveling
          out. Below this speed reduce braking authority; at 0.5 m/s normal velocity
          and vertical control take over. Larger values start the transition earlier
          to reduce reverse motion near a stop.

          '
      type: float
      unit: m/s
      min: 2
      max: 30
      decimal: 1
      default: 10
    DOCK_REC_YAW_V:
      description:
        short: Dock recovery yaw release speed
        long: 'In PASS_PREDICTED, hold the measured heading at recovery entry while
          measured 3-D speed is at or above this threshold. Below it, slew toward
          the heading target saved before recovery at DOCK_YAW_RATE. Re-lock the current
          measured heading if speed rises to the threshold again. Also holds measured
          heading when an automatic Dock fault transfers control to RTL. RTL translation
          remains at zero while speed is reduced below this threshold and the measured
          heading aligns with the settled RTL yaw target at MPC_YAWRAUTO_MAX. Translation
          resumes with a velocity-setpoint ramp; normal RTL then owns yaw. If the
          RTL yaw target is unavailable or alignment times out, native RTL regains
          control. When DOCK_EXIT_MODE selects Hold, the fault handoff instead keeps
          its zero-speed goal until Hold is requested. Applies with either post-pass
          braking method.

          '
      type: float
      unit: m/s
      min: 0.1
      max: 20
      decimal: 1
      default: 2.0
    DOCK_EXIT_MODE:
      description:
        short: Mode after Dock braking
        long: 'Select the flight mode after a predicted target pass has decelerated
          to below 0.5 m/s for 0.5 seconds. On a Dock fault, Commander first takes
          over in RTL and the existing fault braking runs; Hold is requested only
          after the same stop check succeeds. If velocity or position is invalid,
          Commander retains its failsafe authority. A predicted pass does not confirm
          physical contact.

          '
      type: enum
      values:
        0: RTL
        1: Hold
      default: 0
    DOCK_DYN_JERK:
      description:
        short: Dynamic velocity command jerk limit
      type: float
      unit: m/s^3
      min: 0.1
      max: 100
      default: 8.0
