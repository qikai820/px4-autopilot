module_name: Geometric Attitude Control
parameters:
  - group: Geometric Attitude Control
    definitions:
      GAC_RATE_HZ: {description: {short: Attitude and rate loop rate}, type: float, unit: Hz, min: 50, max: 400, default: 400.0}
      GAC_ROLL_P: {description: {short: Roll attitude gain}, type: float, default: 6.0}
      GAC_PITCH_P: {description: {short: Pitch attitude gain}, type: float, default: 6.0}
      GAC_YAW_P: {description: {short: Yaw attitude gain}, type: float, default: 4.0}
      GAC_R_RATE_P: {description: {short: Roll rate proportional gain}, type: float, default: 4.0}
      GAC_P_RATE_P: {description: {short: Pitch rate proportional gain}, type: float, default: 3.2}
      GAC_Y_RATE_P: {description: {short: Yaw rate proportional gain}, type: float, default: 6.5}
      GAC_R_RATE_I: {description: {short: Roll rate integral gain}, type: float, default: 0.05}
      GAC_P_RATE_I: {description: {short: Pitch rate integral gain}, type: float, default: 0.05}
      GAC_Y_RATE_I: {description: {short: Yaw rate integral gain}, type: float, default: 0.08}
      GAC_ATT_I: {description: {short: Attitude integral gain}, type: float, default: 0.15}
      GAC_INT_LIM: {description: {short: Controller integral limit}, type: float, default: 0.3}
      GAC_ROLL_MAX: {description: {short: Hard roll angle limit}, type: float, unit: deg, min: 1, max: 85, default: 35.0}
      GAC_PITCH_MAX: {description: {short: Hard pitch angle limit}, type: float, unit: deg, min: 1, max: 85, default: 35.0}
      GAC_YAW_THR_MIN: {description: {short: Minimum average motor throttle for yaw control}, type: float, min: 0.0, max: 1.0, default: 0.15}
      GAC_DOB_MODE:
        description:
          short: Equivalent torque disturbance observer mode
          long: Mode 1 estimates and logs disturbance without changing control. Mode 2 applies the negative estimate as compensation.
        type: enum
        values:
          0: Disabled
          1: Observe only
          2: Closed-loop compensation
        default: 1
      GAC_DOB_CUTOFF: {description: {short: Disturbance estimate low-pass cutoff}, type: float, unit: rad/s, min: 0.05, max: 20.0, default: 1.0}
      GAC_DOB_LIM: {description: {short: Per-axis disturbance torque limit}, type: float, unit: N m, min: 0.0, max: 10.0, default: 2.0}
      GAC_DOB_AMAX: {description: {short: Maximum attitude error for observer learning}, type: float, unit: deg, min: 0.5, max: 20.0, default: 5.0}
      GAC_DOB_RMAX: {description: {short: Maximum angular rate for observer learning}, type: float, unit: rad/s, min: 0.05, max: 2.0, default: 0.35}
      GAC_IXX: {description: {short: Roll moment of inertia}, type: float, unit: kg m^2, default: 0.182}
      GAC_IYY: {description: {short: Pitch moment of inertia}, type: float, unit: kg m^2, default: 0.260}
      GAC_IZZ: {description: {short: Yaw moment of inertia}, type: float, unit: kg m^2, default: 0.384}
