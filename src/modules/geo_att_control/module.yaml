module_name: Geometric Attitude Control
parameters:
  - group: Geometric Attitude Control
    definitions:
      GAC_RATE_HZ: {description: {short: Attitude and rate loop rate, long: Execution-rate limit for the geometric attitude controller. It must not exceed the available sensor/update rate; lowering it reduces CPU load but adds control delay.}, type: float, unit: Hz, min: 50, max: 400, default: 400.0}
      GAC_ROLL_P: {description: {short: Roll attitude gain, long: Proportional gain from roll attitude error to roll-rate demand. Increase for faster angle capture; excessive gain causes overshoot when actuator delay is significant.}, type: float, default: 6.0}
      GAC_PITCH_P: {description: {short: Pitch attitude gain, long: Proportional gain from pitch attitude error to pitch-rate demand. Tune independently because pitch inertia and thrust-vector authority may differ from roll.}, type: float, default: 6.0}
      GAC_YAW_P: {description: {short: Yaw attitude gain, long: Proportional gain from yaw attitude error to yaw-rate demand. Keep conservative when yaw authority is weak or near the minimum-throttle condition.}, type: float, default: 4.0}
      GAC_R_RATE_P: {description: {short: Roll rate proportional gain, long: Proportional damping gain for roll angular-rate error. Increase to reduce rate overshoot and oscillation only after checking actuator delay and torque saturation.}, type: float, default: 4.0}
      GAC_P_RATE_P: {description: {short: Pitch rate proportional gain, long: Proportional damping gain for pitch angular-rate error. Higher values improve disturbance rejection but can excite structural or servo resonance.}, type: float, default: 3.2}
      GAC_Y_RATE_P: {description: {short: Yaw rate proportional gain, long: Proportional damping gain for yaw angular-rate error. Tune against measured yaw torque authority and motor differential limits.}, type: float, default: 6.5}
      GAC_R_RATE_I: {description: {short: Roll rate integral gain, long: Integrates persistent roll-rate error caused by trim, center-of-gravity offset or steady disturbance. Use a small value and rely on the limit for anti-windup.}, type: float, default: 0.05}
      GAC_P_RATE_I: {description: {short: Pitch rate integral gain, long: Integrates persistent pitch-rate error caused by trim or steady disturbance. Too much integral produces slow attitude drift or overshoot after saturation.}, type: float, default: 0.05}
      GAC_Y_RATE_I: {description: {short: Yaw rate integral gain, long: Integrates persistent yaw-rate error. Increase only when a repeatable yaw bias remains after motor matching and disturbance compensation.}, type: float, default: 0.08}
      GAC_ATT_I: {description: {short: Attitude integral gain, long: Integral correction for steady attitude error. It compensates slow trim and center-of-gravity bias; excessive value causes windup during large maneuvers.}, type: float, default: 0.15}
      GAC_INT_LIM: {description: {short: Controller integral limit, long: Common absolute limit for attitude and rate integral states. It bounds the corrective torque contribution and prevents recovery overshoot after actuator saturation.}, type: float, default: 0.3}
      GAC_ROLL_MAX: {description: {short: Hard roll angle limit, long: Absolute roll reference limit in finite Euler-reference mode. GAC_Q_REF_EN bypasses this limit and uses a continuous quaternion reference.}, type: float, unit: deg, min: 1, max: 179.9, default: 35.0}
      GAC_PITCH_MAX: {description: {short: Hard pitch angle limit, long: Absolute pitch reference limit in finite Euler-reference mode. GAC_Q_REF_EN bypasses this limit and uses a continuous quaternion reference.}, type: float, unit: deg, min: 1, max: 179.9, default: 35.0}
      GAC_Q_REF_EN: {description: {short: Continuous quaternion attitude reference, long: When enabled, manual attitude references are integrated directly on the quaternion using body-axis rate commands and the Euler roll/pitch hard limits are disabled. This permits continuous rotations through plus or minus 90 degrees. Use only after verifying actuator authority; Euler plots will still wrap during a flip.}, type: boolean, default: false}
      GAC_YAW_THR_MIN: {description: {short: Minimum average motor throttle for yaw control, long: Below this average normalized motor command, yaw torque control is suppressed to avoid commanding ineffective differential thrust near idle.}, type: float, min: 0.0, max: 1.0, default: 0.15}
      GAC_DOB_MODE:
        description:
          short: Equivalent torque disturbance observer mode
          long: 0 disables the disturbance observer. 1 estimates and logs equivalent external torque without changing the control output. 2 applies the negative estimate as closed-loop compensation; enable only after verifying the sign and observer stability.
        type: enum
        values:
          0: Disabled
          1: Observe only
          2: Closed-loop compensation
        default: 1
      GAC_DOB_CUTOFF: {description: {short: Disturbance estimate low-pass cutoff, long: Cutoff frequency of the observer low-pass filter. Higher values respond faster but pass more sensor noise and unmodeled actuator dynamics.}, type: float, unit: rad/s, min: 0.05, max: 20.0, default: 1.0}
      GAC_DOB_LIM: {description: {short: Per-axis disturbance torque limit, long: Absolute limit of the estimated equivalent external torque on each body axis. Set above the expected steady disturbance but below a value that could destabilize compensation.}, type: float, unit: N m, min: 0.0, max: 10.0, default: 2.0}
      GAC_DOB_AMAX: {description: {short: Maximum attitude error for observer learning, long: Observer learning is allowed only when the attitude error is below this threshold, preventing commanded maneuvers from being learned as disturbances.}, type: float, unit: deg, min: 0.5, max: 20.0, default: 5.0}
      GAC_DOB_RMAX: {description: {short: Maximum angular rate for observer learning, long: Observer learning is allowed only when the measured and commanded body rates are below this threshold. This is a learning gate, not a vehicle angular-rate limit.}, type: float, unit: rad/s, min: 0.05, max: 2.0, default: 0.35}
      GAC_IXX: {description: {short: Roll moment of inertia, long: Vehicle roll-axis inertia used for feed-forward angular acceleration and disturbance estimation. Use the loaded flight mass and measured inertia, in kg m^2.}, type: float, unit: kg m^2, default: 0.182}
      GAC_IYY: {description: {short: Pitch moment of inertia, long: Vehicle pitch-axis inertia used for feed-forward angular acceleration and disturbance estimation.}, type: float, unit: kg m^2, default: 0.260}
      GAC_IZZ: {description: {short: Yaw moment of inertia, long: Vehicle yaw-axis inertia used for feed-forward angular acceleration and disturbance estimation.}, type: float, unit: kg m^2, default: 0.384}
