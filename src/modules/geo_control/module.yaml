module_name: Geometric Controller (MorphQuad)

parameters:
  - group: Geometric Controller
    definitions:
      GC_MASS:
        description:
          short: Vehicle mass
        type: float
        unit: kg
        min: 0.1
        max: 50.0
        increment: 0.01
        decimal: 2
        default: 4.56

      GC_HOVER_THR:
        description:
          short: Calibrated hover collective thrust
          long: |
            Normalized collective thrust required to hover. This follows the
            PX4 multicopter acceleration-control convention and is used for
            vertical thrust conversion, so vertical velocity feedback is not
            scaled directly by GC_MASS. Calibrate from level hover or use
            mass * g / GC_THRUST_MAX as the initial value.
        type: float
        unit: norm
        min: 0.05
        max: 0.95
        increment: 0.001
        decimal: 3
        default: 0.35

      GC_RATE_HZ:
        description:
          short: Geometric controller execution rate
          long: |
            Maximum execution rate of the geometric controller. The actual
            rate normally follows vehicle_attitude_setpoint; when that topic
            is not published, vehicle_attitude is used as the high-rate source.
            Changes take effect without restarting the module.
        type: float
        unit: Hz
        min: 10
        max: 400
        increment: 1
        decimal: 0
        default: 400

      GC_XY_P:
        description:
          short: Position proportional gain (XY)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 1.0

      GC_XY_VEL_P:
        description:
          short: Velocity proportional gain (XY)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.5

      GC_Z_P:
        description:
          short: Position proportional gain (Z)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 1.5

      GC_Z_VEL_P:
        description:
          short: Vertical velocity-to-acceleration gain
          long: |
            PX4-style vertical velocity P gain. The velocity error is
            converted directly to an acceleration command before hover-thrust
            conversion; it is not divided by GC_MASS.
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 2.0

      GC_RP_P:
        description:
          short: Legacy attitude proportional gain (Roll/Pitch)
          long: Kept for parameter-file compatibility. Use GC_ROLL_P and GC_PITCH_P for new tuning.
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 6.0

      GC_ROLL_P:
        description:
          short: Attitude proportional gain (Roll)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 6.0

      GC_PITCH_P:
        description:
          short: Attitude proportional gain (Pitch)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 6.0

      GC_YAW_P:
        description:
          short: Attitude proportional gain (Yaw)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 4.0

      GC_RP_RATE_P:
        description:
          short: Legacy angular rate gain (Roll/Pitch)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.8

      GC_ROLL_RATE_P:
        description:
          short: Angular rate proportional gain (Roll)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.8

      GC_PITCH_RATE_P:
        description:
          short: Angular rate proportional gain (Pitch)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.8

      GC_YAW_RATE_P:
        description:
          short: Angular rate proportional gain (Yaw)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.7

      GC_INERTIA_XX:
        description:
          short: Inertia matrix diagonal (XX)
        type: float
        unit: kg m^2
        min: 0.001
        max: 10.0
        increment: 0.001
        decimal: 3
        default: 0.1

      GC_INERTIA_YY:
        description:
          short: Inertia matrix diagonal (YY)
        type: float
        unit: kg m^2
        min: 0.001
        max: 10.0
        increment: 0.001
        decimal: 3
        default: 0.1

      GC_INERTIA_ZZ:
        description:
          short: Inertia matrix diagonal (ZZ)
        type: float
        unit: kg m^2
        min: 0.001
        max: 10.0
        increment: 0.001
        decimal: 3
        default: 0.2

      GC_MAN_RATE_MAX:
        description:
          short: Manual mode max angular rate
          long: |
            Stick deflection of +/-1 maps to +/- this angular rate.
            roll/pitch/yaw sticks control body-frame angular rates.
        type: float
        unit: rad/s
        min: 0.1
        max: 10.0
        increment: 0.1
        decimal: 1
        default: 1.5

      GC_MAN_VEL_MAX:
        description:
          short: Legacy manual mode max velocity
          long: |
            Legacy common velocity limit retained for parameter compatibility.
            Use GC_VX_MAX, GC_VY_MAX and GC_VZ_MAX for axis-specific limits.
        type: float
        unit: m/s
        min: 0.1
        max: 20.0
        increment: 0.5
        decimal: 1
        default: 5.0

      GC_VX_MAX:
        description:
          short: Maximum X velocity setpoint
          long: |
            Maximum absolute NED X velocity setpoint in Position mode.
            Full AUX1 stick also maps to this body-X velocity before rotation.
        type: float
        unit: m/s
        min: 0.1
        max: 20.0
        increment: 0.1
        decimal: 1
        default: 2.0

      GC_VY_MAX:
        description:
          short: Maximum Y velocity setpoint
          long: |
            Maximum absolute NED Y velocity setpoint in Position mode.
            Full AUX2 stick also maps to this body-Y velocity before rotation.
        type: float
        unit: m/s
        min: 0.1
        max: 20.0
        increment: 0.1
        decimal: 1
        default: 2.0

      GC_VZ_MAX:
        description:
          short: Maximum Z velocity setpoint
          long: |
            Maximum absolute NED Z velocity setpoint in Position mode.
            Positive NED Z is downward. Full throttle-stick deflection maps
            to this body-Z speed before rotation.
        type: float
        unit: m/s
        min: 0.1
        max: 10.0
        increment: 0.1
        decimal: 1
        default: 1.0

      GC_AX_MAX:
        description:
          short: Maximum X setpoint acceleration
          long: Maximum rate of change of the NED X velocity setpoint in Position mode.
        type: float
        unit: m/s^2
        min: 0.1
        max: 20.0
        increment: 0.1
        decimal: 1
        default: 2.0

      GC_AY_MAX:
        description:
          short: Maximum Y setpoint acceleration
          long: Maximum rate of change of the NED Y velocity setpoint in Position mode.
        type: float
        unit: m/s^2
        min: 0.1
        max: 20.0
        increment: 0.1
        decimal: 1
        default: 2.0

      GC_AZ_MAX:
        description:
          short: Maximum Z setpoint acceleration
          long: Maximum rate of change of the NED Z velocity setpoint in Position mode.
        type: float
        unit: m/s^2
        min: 0.1
        max: 20.0
        increment: 0.1
        decimal: 1
        default: 1.0

      GC_ROLL_MAX:
        description:
          short: Maximum manual roll angle
          long: Maximum absolute roll angle of the integrated attitude reference.
        type: float
        unit: deg
        min: 1.0
        max: 85.0
        increment: 1.0
        decimal: 0
        default: 20.0

      GC_PITCH_MAX:
        description:
          short: Maximum manual pitch angle
          long: Maximum absolute pitch angle of the integrated attitude reference.
        type: float
        unit: deg
        min: 1.0
        max: 85.0
        increment: 1.0
        decimal: 0
        default: 20.0

      GC_MAN_DZ:
        description:
          short: Manual mode stick deadzone
          long: |
            Deadzone applied to all stick inputs in manual mode.
            Stick values within [-dz, +dz] are treated as zero.
            Values outside are rescaled linearly to maintain full range.
        type: float
        min: 0
        max: 0.9
        increment: 0.01
        decimal: 2
        default: 0.1

      GC_RATE_I:
        description:
          short: Legacy rate integral gain (torque loop)
        type: float
        min: 0
        max: 10
        increment: 0.01
        decimal: 3
        default: 0.1

      GC_ROLL_RATE_I:
        description:
          short: Angular rate integral gain (Roll)
        type: float
        min: 0
        max: 10
        increment: 0.01
        decimal: 3
        default: 0.1

      GC_PITCH_RATE_I:
        description:
          short: Angular rate integral gain (Pitch)
        type: float
        min: 0
        max: 10
        increment: 0.01
        decimal: 3
        default: 0.1

      GC_YAW_RATE_I:
        description:
          short: Angular rate integral gain (Yaw)
        type: float
        min: 0
        max: 10
        increment: 0.01
        decimal: 3
        default: 0.1

      GC_SERVO_60_TIME:
        description:
          short: Servo 60 degree movement time
          long: Time required for a morphing servo to rotate 60 degrees; used for attitude-rate lead compensation.
        type: float
        unit: s
        min: 0.01
        max: 5.0
        increment: 0.01
        decimal: 2
        default: 0.20

      GC_ATT_I:
        description:
          short: Attitude error integral gain
        type: float
        min: 0
        max: 10
        increment: 0.01
        decimal: 3
        default: 0.15

      GC_RATE_INT_LIM:
        description:
          short: Rate integrator limit (anti-windup clamp)
        type: float
        min: 0
        max: 10
        increment: 0.05
        decimal: 2
        default: 0.3

      GC_VEL_I:
        description:
          short: Velocity integral gain (force loop)
        type: float
        min: 0
        max: 10
        increment: 0.05
        decimal: 2
        default: 0.1

      GC_VEL_INT_LIM:
        description:
          short: Velocity integrator limit (anti-windup clamp)
        type: float
        min: 0
        max: 20
        increment: 0.5
        decimal: 1
        default: 2.0

      GC_THRUST_MAX:
        description:
          short: Total maximum thrust (all rotors)
          long: |
            Sum of the maximum thrust of every rotor, used to normalize the
            desired force into a [0,1] collective-throttle estimate for the
            debug setpoints. Should equal N_rotors * CA_MQ_TMAX
            (4 * 39.5 = 158 N for the calibrated JSBSim morphquad).
        type: float
        unit: N
        min: 1.0
        max: 500.0
        increment: 0.5
        decimal: 1
        default: 158.0

      GC_MAN_FMAX:
        description:
          short: Manual force-mode max body force
          long: |
            Maximum body-frame force magnitude per axis commanded by the sticks
            in Manual (force open-loop) mode. aux1/aux2 command body x/y force,
            throttle commands body z force (center = hover trim -mass*g, up = climb).
            Keep below the available thrust margin (N_rotors * CA_MQ_TMAX - mass*g).
        type: float
        unit: N
        min: 0.1
        max: 100.0
        increment: 0.5
        decimal: 1
        default: 20.0
