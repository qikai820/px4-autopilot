module_name: Geometric Controller (MorphQuad)

parameters:
  - group: Geometric Controller
    definitions:
      GC_MASS:
        description:
          short: Vehicle mass
        type: float
        unit: kg
        min: 0.1
        max: 50.0
        increment: 0.01
        decimal: 2
        default: 4.56

      GC_XY_P:
        description:
          short: Position proportional gain (XY)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 1.0

      GC_XY_VEL_P:
        description:
          short: Velocity proportional gain (XY)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.5

      GC_Z_P:
        description:
          short: Position proportional gain (Z)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 1.0

      GC_Z_VEL_P:
        description:
          short: Velocity proportional gain (Z)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.5

      GC_RP_P:
        description:
          short: Attitude proportional gain (Roll/Pitch)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 1.0

      GC_YAW_P:
        description:
          short: Attitude proportional gain (Yaw)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.8

      GC_RP_RATE_P:
        description:
          short: Angular rate proportional gain (Roll/Pitch)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.8

      GC_YAW_RATE_P:
        description:
          short: Angular rate proportional gain (Yaw)
        type: float
        min: 0
        max: 100
        increment: 0.1
        decimal: 1
        default: 0.7

      GC_INERTIA_XX:
        description:
          short: Inertia matrix diagonal (XX)
        type: float
        unit: kg m^2
        min: 0.001
        max: 10.0
        increment: 0.001
        decimal: 3
        default: 0.1

      GC_INERTIA_YY:
        description:
          short: Inertia matrix diagonal (YY)
        type: float
        unit: kg m^2
        min: 0.001
        max: 10.0
        increment: 0.001
        decimal: 3
        default: 0.1

      GC_INERTIA_ZZ:
        description:
          short: Inertia matrix diagonal (ZZ)
        type: float
        unit: kg m^2
        min: 0.001
        max: 10.0
        increment: 0.001
        decimal: 3
        default: 0.2

      GC_MAN_RATE_MAX:
        description:
          short: Manual mode max angular rate
          long: |
            Stick deflection of +/-1 maps to +/- this angular rate.
            roll/pitch/yaw sticks control body-frame angular rates.
        type: float
        unit: rad/s
        min: 0.1
        max: 10.0
        increment: 0.1
        decimal: 1
        default: 1.5

      GC_MAN_VEL_MAX:
        description:
          short: Manual mode max velocity
          long: |
            Stick deflection of +/-1 maps to +/- this velocity.
            aux1/aux2/aux3 sticks control body-frame x/y/z velocity.
        type: float
        unit: m/s
        min: 0.1
        max: 20.0
        increment: 0.5
        decimal: 1
        default: 5.0

      GC_MAN_DZ:
        description:
          short: Manual mode stick deadzone
          long: |
            Deadzone applied to all stick inputs in manual mode.
            Stick values within [-dz, +dz] are treated as zero.
            Values outside are rescaled linearly to maintain full range.
        type: float
        min: 0
        max: 0.9
        increment: 0.01
        decimal: 2
        default: 0.1

      GC_RATE_I:
        description:
          short: Rate/angle integral gain (torque loop)
        type: float
        min: 0
        max: 10
        increment: 0.01
        decimal: 3
        default: 0.0

      GC_RATE_INT_LIM:
        description:
          short: Rate integrator limit (anti-windup clamp)
        type: float
        min: 0
        max: 10
        increment: 0.05
        decimal: 2
        default: 0.3

      GC_VEL_I:
        description:
          short: Velocity integral gain (force loop)
        type: float
        min: 0
        max: 10
        increment: 0.05
        decimal: 2
        default: 0.5

      GC_VEL_INT_LIM:
        description:
          short: Velocity integrator limit (anti-windup clamp)
        type: float
        min: 0
        max: 20
        increment: 0.5
        decimal: 1
        default: 2.0

      GC_THRUST_MAX:
        description:
          short: Total maximum thrust (all rotors)
          long: |
            Sum of the maximum thrust of every rotor, used to normalize the
            desired force into a [0,1] collective-throttle estimate for the
            debug setpoints. Should equal N_rotors * CA_MQ_TMAX
            (4 * 39.5 = 158 N for the calibrated JSBSim morphquad).
        type: float
        unit: N
        min: 1.0
        max: 500.0
        increment: 0.5
        decimal: 1
        default: 158.0

      GC_MAN_FMAX:
        description:
          short: Manual force-mode max body force
          long: |
            Maximum body-frame force magnitude per axis commanded by the sticks
            in Manual (force open-loop) mode. aux1/aux2 command body x/y force,
            throttle commands body z force (center = hover trim -mass*g, up = climb).
            Keep below the available thrust margin (N_rotors * CA_MQ_TMAX - mass*g).
        type: float
        unit: N
        min: 0.1
        max: 100.0
        increment: 0.5
        decimal: 1
        default: 20.0
